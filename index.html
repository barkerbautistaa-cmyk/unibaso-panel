<!doctype html>
<!-- El panel de Unibaso se mudó el 15-09-2026 (Supabase + Vercel).

     ya nadie lee: si siguiera andando, lo que Thiago cargara acá se perdería.

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

  a{color:#fff;font-weight:600}
</style>
<script>
  try{ Object.keys(localStorage).forEach(function(k){
    if(k.indexOf("uni_")===0 && k!=="uni_theme") localStorage.removeItem(k); }); }catch(e){}
  location.replace("https://unibaso-panel.vercel.app/");
</script>
</head>
<body>
  <p>El panel de Unibaso se mudó.<br>
